included:
  - App
  - Packages/UsageMonitorCore/Sources
  - Packages/UsageMonitorCore/Tests
  - UITests
excluded:
  - .build
  - DerivedData
  - Packages/UsageMonitorCore/.build
opt_in_rules:
  - closure_spacing
  - empty_count
  - explicit_init
  - fatal_error_message
  - first_where
  - force_unwrapping
  - implicitly_unwrapped_optional
  - last_where
  - redundant_nil_coalescing
  - sorted_first_last
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - vertical_whitespace_closing_braces
line_length:
  warning: 120
  error: 160
  ignores_urls: true
  ignores_comments: true
identifier_name:
  min_length:
    warning: 2
  excluded: [id, ok, x, y]
type_body_length:
  warning: 300
  error: 400
file_length:
  warning: 400
  error: 600
function_body_length:
  warning: 50
  error: 80
cyclomatic_complexity:
  warning: 12
  error: 20
nesting:
  type_level: 2
trailing_comma:
  mandatory_comma: true
