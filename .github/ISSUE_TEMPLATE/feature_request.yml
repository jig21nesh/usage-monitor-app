name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do and what gets in the way.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: constraints
    attributes:
      label: Project constraints
      description: The proposal must fit these; tick to confirm you have read them.
      options:
        - label: It does not require the app to store, refresh or transmit vendor credentials (ADR 0002).
          required: true
        - label: It does not send data off the user's Mac (ADR 0006).
          required: true
