name: Bug report
description: Something in the app misbehaves
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please redact anything that looks like a token or an account
        identifier before pasting. The Diagnostics report in Settings is already redacted.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the panel
        2. ...
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "27.0 (26A428)"
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: App version or commit
      placeholder: "0.1.0 or abc1234"
    validations:
      required: true
  - type: input
    id: xcode
    attributes:
      label: Xcode version (if built from source)
      placeholder: "26.6"
  - type: dropdown
    id: providers
    attributes:
      label: Providers affected
      multiple: true
      options:
        - Claude
        - OpenAI
        - Grok
        - GitHub Copilot
        - Cursor
        - Muse Code
        - OpenCode Go
        - None / app-wide
    validations:
      required: true
  - type: textarea
    id: cli-versions
    attributes:
      label: Vendor CLI versions
      description: Output of `claude --version`, `codex --version`, `grok --version`, `gh --version`, `cursor-agent --version`, `muse --version`, `opencode --version` as applicable.
      render: text
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics report
      description: Settings > Diagnostics > Copy report. It is redacted at source; check it anyway before pasting.
      render: text
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmation
      options:
        - label: I checked that no token, cookie or account identifier is included above.
          required: true
