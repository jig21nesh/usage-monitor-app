name: Release

# Builds the DMG on version tags and attaches it to a GitHub Release (ADR 0007). Signing and
# notarisation run only when the Developer ID and App Store Connect secrets exist; otherwise the
# release is published as an unsigned build. Manual runs upload the DMG as a workflow artifact.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version for the DMG file name (for example 0.1.0)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  XCODE_APP: /Applications/Xcode_26.6.app

jobs:
  release:
    name: Build DMG and publish
    runs-on: macos-26
    timeout-minutes: 40
    env:
      # Secrets cannot be read in `if:` directly; a job-level env flag can (docs.github.com).
      HAS_SIGNING: ${{ secrets.BUILD_CERTIFICATE_BASE64 != '' && secrets.APP_STORE_CONNECT_PRIVATE_KEY != '' }}
      KEYCHAIN_PATH: ${{ runner.temp }}/release-signing.keychain-db
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode
        run: |
          if [ -d "$XCODE_APP" ]; then sudo xcode-select -s "$XCODE_APP"; fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen

      - name: Resolve version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=${{ inputs.version }}" >> "$GITHUB_ENV"
          fi

      - name: Import Developer ID certificate and notary key
        if: env.HAS_SIGNING == 'true'
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          rm -f "$CERTIFICATE_PATH"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | awk -F'"' '/Developer ID Application/ {print $2; exit}')"
          [ -n "$IDENTITY" ] || { echo "No Developer ID Application identity in the imported certificate" >&2; exit 1; }
          echo -n "$APP_STORE_CONNECT_PRIVATE_KEY" | base64 --decode -o "$RUNNER_TEMP/AuthKey.p8"
          {
            echo "SIGNING_IDENTITY=$IDENTITY"
            echo "NOTARY_KEY_PATH=$RUNNER_TEMP/AuthKey.p8"
            echo "NOTARY_KEY_ID=$APP_STORE_CONNECT_KEY_ID"
            echo "NOTARY_ISSUER_ID=$APP_STORE_CONNECT_ISSUER_ID"
          } >> "$GITHUB_ENV"

      - name: Build DMG
        run: scripts/build-dmg.sh --version "$VERSION"

      - name: Publish GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/*.dmg
            dist/*.sha256
          generate_release_notes: true
          body: >-
            ${{ env.HAS_SIGNING == 'true'
                && 'Signed with Developer ID and notarised by Apple.'
                || 'Unsigned build. See README, Installation, for how to open it on macOS 26 and 27.' }}

      - name: Upload DMG artifact (manual run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: AIUsageMonitor-${{ env.VERSION }}
          path: |
            dist/*.dmg
            dist/*.sha256
          retention-days: 14

      - name: Clean up signing material
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/build_certificate.p12"
